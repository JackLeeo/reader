name: Build iOS IPA (TrollStore)

# 触发: push tag v* 或手动 workflow_dispatch
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如 1.0.0)，留空则从 pubspec.yaml 读取"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

env:
  # Flutter 3.32.x 是当前 stable. 切勿填不存在的版本 (例 3.44.2)
  FLUTTER_VERSION: "3.32.8"
  BUNDLE_ID: "com.reader.reader"
  PROJECT_NAME: "Reader"

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter / Xcode versions
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Resolve dependencies
        run: flutter pub get

      - name: Set version (if provided)
        if: ${{ github.event.inputs.version != '' }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i.bak "s/^version:.*/version: ${VERSION}+1/" pubspec.yaml
          head -5 pubspec.yaml

      - name: Precache iOS artifacts
        run: |
          flutter precache --ios
          yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Build iOS (no codesign)
        # flutter build ios 会自动创建 Podfile 并执行 pod install
        run: |
          flutter build ios \
            --release \
            --no-codesign

      - name: Locate built .app
        id: locate_app
        run: |
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 包"
            find build/ios -name "*.app" -type d || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Built app: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Read version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${{ steps.locate_app.outputs.app_path }}/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${{ steps.locate_app.outputs.app_path }}/Info.plist")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION ($BUILD)"

      # 签名方式选择：
      # 1) 若提供 IOS_P12_BASE64 等签名密钥 → 用 zsign 签名
      # 2) 否则 → 走「未签名」TrollStore 流程
      - name: Determine signing mode
        id: signing
        run: |
          if [ -n "${{ secrets.IOS_P12_BASE64 }}" ] && [ -n "${{ secrets.IOS_P12_PASSWORD }}" ] && [ -n "${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}" ]; then
            echo "mode=signed" >> $GITHUB_OUTPUT
            echo "Signing mode: SIGNED (with personal certificate)"
          else
            echo "mode=unsigned" >> $GITHUB_OUTPUT
            echo "Signing mode: UNSIGNED (TrollStore via ldid/CoreTrust)"
          fi

      - name: Install ldid
        # TrollStore 走未签名 + ldid ad-hoc 伪签名
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          brew install ldid || true
          ldid -h 2>&1 | head -3 || true

      - name: Install zsign
        if: steps.signing.outputs.mode == 'signed'
        run: |
          brew install zsign
          zsign --help

      - name: Decode signing material
        if: steps.signing.outputs.mode == 'signed'
        run: |
          mkdir -p signing
          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > signing/cert.p12
          echo "${{ secrets.IOS_MOBILE_PROVISION_BASE64 }}" | base64 --decode > signing/profile.mobileprovision
          ls -la signing/

      - name: Sign with zsign
        if: steps.signing.outputs.mode == 'signed'
        working-directory: signing
        run: |
          zsign \
            -k cert.p12 \
            -p "${{ secrets.IOS_P12_PASSWORD }}" \
            -m profile.mobileprovision \
            -b "${{ env.BUNDLE_ID }}" \
            -o Reader.ipa \
            "${{ steps.locate_app.outputs.app_path }}"

      - name: Ad-hoc pseudo-sign with ldid (TrollStore)
        # 对所有 framework + dylib 做 ad-hoc 伪签名, 保证 TrollStore 接受
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          set -e
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          # Strip 原签名
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f  "$APP_PATH/embedded.mobileprovision"
          # 签主可执行
          if [ -f "$APP_PATH/${{ env.PROJECT_NAME }}" ]; then
            ldid -S "$APP_PATH/${{ env.PROJECT_NAME }}" 2>/dev/null || true
          fi
          # 签所有 framework
          if [ -d "$APP_PATH/Frameworks" ]; then
            for FW in "$APP_PATH/Frameworks/"*.framework; do
              [ -d "$FW" ] || continue
              FWNAME=$(basename "$FW" .framework)
              if [ -f "$FW/$FWNAME" ]; then
                ldid -S "$FW/$FWNAME" 2>/dev/null || true
              fi
            done
            for DYLIB in "$APP_PATH/Frameworks/"*.dylib; do
              [ -f "$DYLIB" ] || continue
              ldid -S "$DYLIB" 2>/dev/null || true
            done
          fi
          echo "✅ ldid ad-hoc signing done"

      - name: Package unsigned IPA
        if: steps.signing.outputs.mode == 'unsigned'
        run: |
          STAGING_DIR=$(mktemp -d -t reader-ipa-XXXXXX)
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "${{ steps.locate_app.outputs.app_path }}" "$STAGING_DIR/Payload/"
          cd "$STAGING_DIR"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Reader-unsigned-${{ steps.version.outputs.version }}.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -la *.ipa
          echo "=== IPA 内容预览 ==="
          unzip -l "Reader-unsigned-${{ steps.version.outputs.version }}.ipa" | head -20

      - name: Rename signed IPA
        if: steps.signing.outputs.mode == 'signed'
        run: |
          mv signing/Reader.ipa "Reader-signed-${{ steps.version.outputs.version }}.ipa"
          ls -la *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-ios-ipa
          path: |
            Reader-*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Reader-*.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 下载

            - **未签名 IPA**: 适用于 TrollStore 直接安装
            - **签名 IPA** (若提供): 可通过 AltStore/Sideloadly 安装

            ## 安装方式

            ### TrollStore (推荐)
            1. 在已安装 TrollStore 的设备上打开 IPA
            2. 选择「安装」即可

            ### AltStore / Sideloadly
            1. 使用未签名 IPA 通过 AltStore 或 Sideloadly 签名安装
            2. 需要 Apple ID (免费账户7天有效，付费账户1年)

            ## 系统要求
            - iOS 13.0+
            - arm64 设备

            ## 功能特性
            - 📚 多书源 (兼容 Legado 格式，已内置 1.98MB 完美书源)
            - 🔍 多源并发聚合搜索
            - 📖 4 种翻页模式 (无动画/上下滑动/仿真翻页)
            - 🔖 书签 / 笔记
            - 🔄 单书内多源切换
            - 📊 阅读统计 (今日/本周/累计 + 14天柱状图)
            - 📁 本地 TXT 导入与阅读 (自动章节切分 + GBK/UTF-8 编码探测)
            - 🎨 6 套主题色 + 自定义字号/行距
            - 💾 章节缓存 + 自动断点续读

            由 GitHub Actions 自动构建
